<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f7fc" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0f1a26" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MGO Portal — access the property, accounting, document, online collections and other municipal systems of the Municipal Government of Candoni.">
  <title>MGO Portal · Municipality of Candoni</title>
  <link rel="icon" href="candoni-seal.svg" type="image/svg+xml">
  <style>
    :root {
      color-scheme:light dark;
      --bg:#f3f7fc; --surface:#fff; --surface-2:#f7fafd; --ink:#1f3347; --muted:#5f7184; --faint:#8a99a8;
      --line:#e2e9f1; --line-strong:#cddbe8; --blue:#2466a3; --blue-strong:#1b5288; --blue-soft:#e9f2fc;
      --hero-1:#e6f1fc; --hero-2:#f3f7fc; --shadow:0 1px 2px #1b3a5a0d, 0 4px 16px #1b3a5a0a; --shadow-hover:0 2px 4px #1b3a5a12, 0 12px 32px #1b3a5a14;
      --bad:#a33b3b; --bad-soft:#fbeaea;
    }
    @media (prefers-color-scheme:dark) {
      :root {
        --bg:#0f1a26; --surface:#162433; --surface-2:#1b2b3c; --ink:#e3ebf3; --muted:#9db0c3; --faint:#7389a0;
        --line:#24384c; --line-strong:#2f4760; --blue:#6cb0f0; --blue-strong:#8cc2f5; --blue-soft:#1d3550;
        --hero-1:#13263a; --hero-2:#0f1a26; --shadow:0 1px 2px #0006; --shadow-hover:0 10px 30px #0008;
        --bad:#f19a9a; --bad-soft:#3d1e1e;
      }
    }
    * { box-sizing:border-box; }
    html { scroll-padding-top:20px; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.55 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    [hidden] { display:none !important; }
    .skip { position:fixed; top:12px; left:12px; padding:10px 16px; background:var(--surface); border-radius:8px; z-index:10; transform:translateY(-200%); }
    .skip:focus { transform:none; }
    :focus-visible { outline:3px solid #3a8ae0; outline-offset:3px; }
    svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .page { min-height:100svh; display:flex; flex-direction:column; }
    .wrap { width:100%; max-width:1200px; margin:0 auto; padding:0 32px; }

    /* Header */
    .topbar { position:sticky; top:0; z-index:5; background:color-mix(in srgb, var(--surface) 88%, transparent); backdrop-filter:saturate(1.4) blur(10px); border-bottom:1px solid var(--line); }
    .topbar .wrap { min-height:72px; display:flex; align-items:center; justify-content:space-between; gap:20px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; text-decoration:none; }
    .seal { width:44px; height:44px; flex-shrink:0; }
    .brand-name { font-size:17px; font-weight:700; letter-spacing:-.3px; line-height:1.2; }
    .brand-sub { color:var(--muted); font-size:12.5px; }

    /* Status */
    main { flex:1; }
    .status { color:var(--muted); font-size:14px; margin:0 0 16px; }
    .error { margin:0 0 16px; padding:14px 16px; border:1px solid color-mix(in srgb, var(--bad) 30%, transparent); color:var(--bad); background:var(--bad-soft); border-radius:10px; font-size:14px; }

    /* Portal hero */
    .hero { padding:44px 0 34px; background:linear-gradient(180deg, var(--hero-1), var(--hero-2)); border-bottom:1px solid var(--line); }
    .today { margin:0 0 6px; font-size:13px; font-weight:600; color:var(--blue); }
    .hero h1 { font-size:32px; font-weight:700; letter-spacing:-.9px; line-height:1.2; margin:0 0 6px; }
    .intro { margin:0; color:var(--muted); font-size:16px; }

    /* Section headings */
    .section { padding-top:34px; padding-bottom:8px; }
    .section-head { display:flex; justify-content:space-between; gap:16px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
    .section-head h2 { display:flex; align-items:center; gap:10px; font-size:18px; font-weight:700; letter-spacing:-.3px; margin:0; }
    .count-chip { font-size:12.5px; font-weight:600; color:var(--muted); background:var(--surface); border:1px solid var(--line); border-radius:999px; padding:2px 10px; }

    /* Application cards */
    .apps { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:16px; }
    .app { --accent:#2466a3; --accent-soft:#e8f1fb; position:relative; display:flex; flex-direction:column; min-width:0; text-decoration:none; padding:22px; background:var(--surface); border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow); overflow:hidden; transition:border-color .18s,box-shadow .18s,transform .18s; }
    .app::before { content:""; position:absolute; inset:0 0 auto; height:3px; background:var(--accent); opacity:.85; }
    .app:hover { border-color:color-mix(in srgb, var(--accent) 40%, var(--line)); box-shadow:var(--shadow-hover); transform:translateY(-2px); }
    .card-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
    .icon { display:grid; place-items:center; width:46px; height:46px; border-radius:12px; background:var(--accent-soft); color:var(--accent); }
    .code { font-size:11.5px; font-weight:700; letter-spacing:.8px; color:var(--accent); background:var(--accent-soft); padding:3px 9px; border-radius:999px; }
    .app h3 { font-size:17.5px; font-weight:650; letter-spacing:-.3px; line-height:1.35; margin:0 0 6px; }
    .description { color:var(--muted); font-size:14.5px; margin:0 0 18px; }
    .card-bottom { display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:auto; padding-top:14px; border-top:1px solid var(--line); }
    .domain { min-width:0; font-size:12.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .launch { display:inline-flex; align-items:center; gap:4px; font-size:13px; font-weight:600; color:var(--accent); white-space:nowrap; }
    .launch svg { width:15px; height:15px; stroke-width:2; transition:transform .18s; }
    .app:hover .launch svg { transform:translate(2px,-2px); }
    .app:nth-child(6n+1) { --accent:#2466a3; --accent-soft:#e8f1fb; }
    .app:nth-child(6n+2) { --accent:#0f7c74; --accent-soft:#e2f4f2; }
    .app:nth-child(6n+3) { --accent:#2f7d3c; --accent-soft:#e7f4e8; }
    .app:nth-child(6n+4) { --accent:#5b4bc4; --accent-soft:#eeebfb; }
    .app:nth-child(6n+5) { --accent:#b35c12; --accent-soft:#fcefe2; }
    .app:nth-child(6n+6) { --accent:#a8396b; --accent-soft:#fbe9f1; }
    @media (prefers-color-scheme:dark) {
      .app:nth-child(6n+1) { --accent:#7ab8f5; --accent-soft:#1c3550; }
      .app:nth-child(6n+2) { --accent:#5fd0c4; --accent-soft:#143a38; }
      .app:nth-child(6n+3) { --accent:#7fd18c; --accent-soft:#173a1d; }
      .app:nth-child(6n+4) { --accent:#ada3f5; --accent-soft:#2a2650; }
      .app:nth-child(6n+5) { --accent:#f2a865; --accent-soft:#3d2a16; }
      .app:nth-child(6n+6) { --accent:#f095bd; --accent-soft:#3d1c2c; }
    }
    .hint { display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); margin:18px 0 0; }
    .hint svg { width:16px; height:16px; }


    .footer { border-top:1px solid var(--line); margin-top:40px; }
    .footer .wrap { display:flex; justify-content:space-between; flex-wrap:wrap; gap:6px 24px; padding-top:20px; padding-bottom:24px; font-size:12.5px; color:var(--faint); }

    @media(max-width:720px) {
      .wrap { padding:0 16px; }
      .topbar .wrap { min-height:64px; }
      .seal { width:38px; height:38px; }
      .hero { padding:30px 0 24px; } .hero h1 { font-size:26px; }
    }
    @media(prefers-reduced-motion:reduce) { .app, .launch svg { transition:none; } .app:hover { transform:none; } }
  </style>
</head>
<body>
  <a class="skip" href="#apps-title">Skip to applications</a>
  <div class="page">
    <header class="topbar">
      <div class="wrap">
        <div class="brand"><img class="seal" src="candoni-seal.svg" alt="Municipality of Candoni seal" width="44" height="44"><div><div class="brand-name">MGO Portal</div><div class="brand-sub">Municipal Government of Candoni</div></div></div>
      </div>
    </header>
    <main id="main" tabindex="-1">
      <div id="portal">
        <section class="hero">
          <div class="wrap">
            <p class="today" id="today"></p>
            <h1 id="portal-title">Applications</h1>
            <p class="intro">Choose a system to open your workspace.</p>
          </div>
        </section>
        <section class="section wrap" aria-labelledby="apps-title">
          <div class="section-head"><h2 id="apps-title">Municipal systems <span class="count-chip" id="app-count"></span></h2></div>
          <p id="status" class="status" role="status">Loading applications…</p>
          <div class="apps" id="apps"></div>
          <p class="hint" id="new-tab"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg>Systems open in a new tab. Sign in using your account for each system.</p>
        </section>
      </div>
    </main>
    <footer class="footer"><div class="wrap"><span>© Municipal Government of Candoni</span><span>MGO Portal · Staff portal</span></div></footer>
  </div>
  <noscript><p class="error wrap">JavaScript is required to show the applications. Please enable it and reload this page.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
