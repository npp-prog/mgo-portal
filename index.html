<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1724" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MGO ERP — finance, assets, records and program systems of the Municipal Government of Candoni in one place.">
  <title>MGO ERP · Municipality of Candoni</title>
  <link rel="icon" href="candoni-seal.svg" type="image/svg+xml">
  <script>try { const t = localStorage.getItem('mgo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <style>
    :root {
      color-scheme:light;
      --bg:#ffffff; --surface:#ffffff; --ink:#122b45; --muted:#5a6e83; --faint:#8696a8;
      --line:#e6ecf2; --blue:#1f62a8; --blue-soft:#edf4fc; --glow:#1f62a814; --mark:#d9e9fb;
      --bad:#a33b3b; --bad-soft:#fbeaea;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        color-scheme:dark;
        --bg:#0d1724; --surface:#111e2e; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
        --line:#1f3247; --blue:#7db8f3; --blue-soft:#17304b; --glow:#7db8f31f; --mark:#24476d;
        --bad:#f19a9a; --bad-soft:#3d1e1e;
      }
    }
    :root[data-theme=dark] {
      color-scheme:dark;
      --bg:#0d1724; --surface:#111e2e; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
      --line:#1f3247; --blue:#7db8f3; --blue-soft:#17304b; --glow:#7db8f31f; --mark:#24476d;
      --bad:#f19a9a; --bad-soft:#3d1e1e;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; transition:background-color .25s,color .25s; }
    [hidden] { display:none !important; }
    .visually-hidden { position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; }
    .skip { position:fixed; top:12px; left:12px; padding:10px 16px; background:var(--surface); color:var(--ink); border-radius:8px; z-index:10; transform:translateY(-200%); }
    .skip:focus { transform:none; }
    :focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .page { min-height:100svh; display:flex; flex-direction:column; }
    .wrap { width:100%; max-width:1000px; margin:0 auto; padding-left:32px; padding-right:32px; }

    header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:24px; padding-bottom:24px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .seal { width:38px; height:38px; flex-shrink:0; }
    .brand-name { font-size:16px; font-weight:750; letter-spacing:-.2px; line-height:1.25; }
    .brand-sub { color:var(--muted); font-size:13px; line-height:1.3; }
    .theme-toggle { display:grid; place-items:center; width:40px; height:40px; padding:0; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:50%; cursor:pointer; transition:color .15s,border-color .15s,transform .3s; }
    .theme-toggle:hover { color:var(--blue); border-color:var(--blue); transform:rotate(-20deg); }
    .theme-toggle svg { width:18px; height:18px; }
    .theme-toggle .sun, :root[data-theme=dark] .theme-toggle .moon { display:none; }
    :root[data-theme=dark] .theme-toggle .sun { display:block; }
    @media (prefers-color-scheme:dark) { :root:not([data-theme=light]) .theme-toggle .moon { display:none; } :root:not([data-theme=light]) .theme-toggle .sun { display:block; } }

    main { flex:1; padding-top:48px; padding-bottom:80px; }
    .today { margin:0 0 6px; font-size:14px; font-weight:600; color:var(--blue); }
    h1 { font-size:38px; font-weight:750; letter-spacing:-1.2px; line-height:1.12; margin:0 0 28px; }

    .search { position:relative; display:block; }
    .search > svg { position:absolute; left:18px; top:50%; transform:translateY(-50%); color:var(--faint); pointer-events:none; transition:color .15s; }
    .search input { width:100%; padding:16px 92px 16px 50px; font:inherit; font-size:17px; color:var(--ink); background:var(--surface); border:1px solid var(--line); border-radius:14px; outline:none; transition:border-color .15s,box-shadow .15s; -webkit-appearance:none; }
    .search input::placeholder { color:var(--faint); }
    .search input::-webkit-search-cancel-button { display:none; }
    .search input:focus { border-color:var(--blue); box-shadow:0 0 0 4px var(--glow); }
    .search:focus-within > svg { color:var(--blue); }
    .search-hint { position:absolute; right:14px; top:50%; transform:translateY(-50%); display:flex; gap:6px; align-items:center; font-size:12.5px; color:var(--faint); pointer-events:none; }
    kbd { display:inline-block; min-width:22px; padding:1px 6px; font:600 12px/18px inherit; text-align:center; color:var(--muted); border:1px solid var(--line); border-bottom-width:2px; border-radius:6px; }
    .clear { position:absolute; right:10px; top:50%; transform:translateY(-50%); display:grid; place-items:center; width:32px; height:32px; padding:0; color:var(--faint); background:transparent; border:0; border-radius:8px; cursor:pointer; }
    .clear:hover { color:var(--ink); background:var(--blue-soft); }
    .clear svg { width:16px; height:16px; }

    .chips { display:flex; flex-wrap:wrap; gap:8px; margin:18px 0 28px; padding:0; list-style:none; }
    .chip { display:inline-flex; align-items:center; gap:7px; padding:7px 14px; font:inherit; font-size:14px; font-weight:550; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:999px; cursor:pointer; transition:color .15s,background-color .15s,border-color .15s; }
    .chip:hover { color:var(--ink); border-color:var(--blue); }
    .chip[aria-pressed=true] { color:#fff; background:#1f62a8; border-color:#1f62a8; }
    .chip .n { font-size:12px; font-weight:700; opacity:.7; }

    .apps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .app { --x:50%; --y:50%; position:relative; display:flex; flex-direction:column; min-width:0; padding:22px; color:inherit; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:16px; overflow:hidden; isolation:isolate; transition:border-color .2s,transform .2s; animation:rise .35s ease both; animation-delay:calc(var(--i, 0) * 40ms); }
    .app::before { content:""; position:absolute; inset:0; z-index:-1; background:radial-gradient(320px circle at var(--x) var(--y), var(--glow), transparent 60%); opacity:0; transition:opacity .2s; }
    .app:hover, .app:focus-visible { border-color:var(--blue); transform:translateY(-3px); }
    .app:hover::before, .app:focus-visible::before { opacity:1; }
    .app.first { border-color:var(--blue); }
    @keyframes rise { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
    .icon { display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--blue-soft); color:var(--blue); transition:transform .2s; }
    .app:hover .icon { transform:scale(1.06); }
    .launch { display:grid; place-items:center; width:32px; height:32px; border-radius:50%; color:var(--faint); transition:color .2s,background-color .2s,transform .2s; }
    .launch svg { width:16px; height:16px; stroke-width:2; }
    .app:hover .launch, .app:focus-visible .launch { color:#fff; background:#1f62a8; transform:translate(2px,-2px); }
    .tag { margin:0 0 4px; font-size:12px; font-weight:650; letter-spacing:.3px; color:var(--blue); }
    .app h2 { font-size:17px; font-weight:650; letter-spacing:-.2px; line-height:1.35; margin:0 0 6px; }
    .description { color:var(--muted); font-size:14.5px; line-height:1.55; margin:0 0 18px; }
    .domain { margin-top:auto; font-size:12.5px; color:var(--faint); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    mark { color:inherit; background:var(--mark); border-radius:3px; padding:0 1px; }
    .empty { grid-column:1 / -1; padding:48px 20px; text-align:center; color:var(--muted); border:1px dashed var(--line); border-radius:16px; }
    .empty p { margin:0; }
    .empty button { margin-top:12px; padding:8px 16px; font:inherit; font-size:14px; font-weight:600; color:var(--blue); background:transparent; border:1px solid var(--line); border-radius:999px; cursor:pointer; }
    .empty button:hover { border-color:var(--blue); }
    .hint { margin:22px 0 0; font-size:13px; color:var(--faint); }
    .error { grid-column:1 / -1; padding:14px 16px; color:var(--bad); background:var(--bad-soft); border-radius:10px; }

    .foot { padding:24px 0 32px; border-top:1px solid var(--line); font-size:13px; color:var(--faint); }

    @media(max-width:900px) { .apps { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:600px) {
      .wrap { padding-left:20px; padding-right:20px; }
      header .wrap { padding-top:18px; padding-bottom:18px; }
      .seal { width:34px; height:34px; }
      main { padding-top:20px; padding-bottom:48px; }
      h1 { font-size:28px; margin-bottom:20px; }
      .search input { font-size:16px; padding:14px 48px 14px 46px; }
      .search-hint { display:none; }
      .chips { flex-wrap:nowrap; overflow-x:auto; margin:14px -20px 20px; padding:0 20px 4px; scrollbar-width:none; }
      .chip { flex-shrink:0; }
      .apps { grid-template-columns:1fr; gap:12px; }
      .app { padding:20px; }
    }
    @media(prefers-reduced-motion:reduce) {
      *, *::before { animation:none !important; transition:none !important; }
      .app:hover, .app:focus-visible { transform:none; }
    }
  </style>
</head>
<body>
  <a class="skip" href="#search">Skip to search</a>
  <div class="page">
    <header>
      <div class="wrap">
        <div class="brand"><img class="seal" src="candoni-seal.svg" alt="Municipality of Candoni seal" width="38" height="38"><div><div class="brand-name">MGO ERP</div><div class="brand-sub">Municipal Government of Candoni</div></div></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </header>
    <main id="main">
      <div class="wrap">
        <p class="today" id="today"></p>
        <h1 id="greeting">Welcome</h1>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input id="search" type="search" placeholder="Search systems" aria-label="Search systems" aria-describedby="results" autocomplete="off" spellcheck="false">
          <span class="search-hint" id="search-hint" aria-hidden="true">Press <kbd>/</kbd></span>
          <button class="clear" id="clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        </label>
        <ul class="chips" id="chips" aria-label="Filter by department"></ul>
        <p class="visually-hidden" id="results" role="status" aria-live="polite"></p>
        <div class="apps" id="apps"><p class="hint">Loading systems…</p></div>
        <p class="hint"><span id="new-tab">Systems open in a new tab and use their own sign-in.</span><span id="enter-tip" hidden> Press Enter to open the highlighted one.</span></p>
      </div>
    </main>
    <footer><div class="wrap"><div class="foot">© Municipal Government of Candoni</div></div></footer>
  </div>
  <noscript><p class="error wrap">JavaScript is required to show the systems. Please enable it and reload this page.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
