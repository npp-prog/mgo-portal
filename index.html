<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1724" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MGO ERP — finance, assets, records and program systems of the Municipal Government of Candoni in one place.">
  <title>MGO ERP · Municipality of Candoni</title>
  <link rel="icon" href="candoni-seal.svg" type="image/svg+xml">
  <script>try { const t = localStorage.getItem('mgo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <style>
    :root {
      color-scheme:light;
      --bg:#f6f8fb; --surface:#ffffff; --side:#ffffff; --ink:#122b45; --muted:#5a6e83; --faint:#8696a8;
      --line:#e4eaf1; --blue:#1f62a8; --blue-strong:#174d86; --blue-soft:#edf4fc; --hover:#f2f6fa;
      --bad:#a33b3b; --bad-soft:#fbeaea; --scrim:#0c1a2a66;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        color-scheme:dark;
        --bg:#0b1420; --surface:#111e2e; --side:#0e1928; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
        --line:#1f3247; --blue:#7db8f3; --blue-strong:#a3cdf7; --blue-soft:#17304b; --hover:#152639;
        --bad:#f19a9a; --bad-soft:#3d1e1e; --scrim:#000a;
      }
    }
    :root[data-theme=dark] {
      color-scheme:dark;
      --bg:#0b1420; --surface:#111e2e; --side:#0e1928; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
      --line:#1f3247; --blue:#7db8f3; --blue-strong:#a3cdf7; --blue-soft:#17304b; --hover:#152639;
      --bad:#f19a9a; --bad-soft:#3d1e1e; --scrim:#000a;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    a { color:inherit; }
    [hidden] { display:none !important; }
    .skip { position:fixed; top:12px; left:12px; padding:10px 16px; background:var(--surface); color:var(--ink); border-radius:8px; z-index:40; transform:translateY(-200%); }
    .skip:focus { transform:none; }
    :focus-visible { outline:2px solid var(--blue); outline-offset:2px; }
    svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .icon-button { display:grid; place-items:center; width:38px; height:38px; padding:0; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:10px; cursor:pointer; transition:color .15s,border-color .15s,background-color .15s; }
    .icon-button:hover { color:var(--blue); border-color:var(--blue); }
    .icon-button svg { width:18px; height:18px; }

    /* Shell */
    .shell { display:grid; grid-template-columns:280px minmax(0,1fr); min-height:100svh; }
    .sidebar { position:sticky; top:0; height:100svh; display:flex; flex-direction:column; background:var(--side); border-right:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; padding:20px 20px 16px; text-decoration:none; }
    .seal { width:38px; height:38px; flex-shrink:0; }
    .brand-name { font-size:16px; font-weight:750; letter-spacing:-.2px; line-height:1.2; }
    .brand-sub { color:var(--muted); font-size:12px; line-height:1.3; white-space:nowrap; }
    .search { position:relative; margin:4px 16px 12px; }
    .search svg { position:absolute; left:11px; top:50%; width:16px; height:16px; transform:translateY(-50%); color:var(--faint); pointer-events:none; }
    .search input { width:100%; padding:8px 34px 8px 34px; font:inherit; font-size:14px; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:9px; }
    .search input::placeholder { color:var(--faint); }
    .search kbd { position:absolute; right:9px; top:50%; transform:translateY(-50%); padding:0 6px; font:600 11px/18px inherit; color:var(--faint); border:1px solid var(--line); border-radius:5px; }
    .nav { flex:1; overflow-y:auto; padding:4px 12px 16px; }
    .nav-group { margin:14px 8px 4px; font-size:11px; font-weight:700; letter-spacing:1px; text-transform:uppercase; color:var(--faint); }
    .nav a { display:flex; align-items:center; gap:10px; padding:7px 10px; margin:1px 0; font-size:14px; font-weight:500; color:var(--muted); text-decoration:none; border-radius:8px; }
    .nav a:hover { color:var(--ink); background:var(--hover); }
    .nav a[aria-current=page] { color:var(--blue); background:var(--blue-soft); font-weight:600; }
    .nav a svg { width:18px; height:18px; }
    .nav a span:first-of-type { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .nav .nav-code { margin-left:auto; font-size:10.5px; font-weight:700; letter-spacing:.5px; color:var(--faint); }
    .nav a[aria-current=page] .nav-code { color:var(--blue); }
    .nav-empty { margin:12px 10px; font-size:13px; color:var(--faint); }
    .side-foot { padding:14px 20px 18px; border-top:1px solid var(--line); font-size:12px; color:var(--faint); }

    /* Top bar */
    .content { display:flex; flex-direction:column; min-width:0; }
    .topbar { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; min-height:64px; padding:0 32px; background:color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
    .menu-button { display:none; }
    .crumbs { display:flex; align-items:center; gap:8px; min-width:0; margin:0; padding:0; list-style:none; font-size:14px; color:var(--muted); }
    .crumbs li { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .crumbs li + li::before { content:"/"; margin-right:8px; color:var(--faint); }
    .crumbs a { text-decoration:none; } .crumbs a:hover { color:var(--blue); }
    .crumbs [aria-current] { color:var(--ink); font-weight:600; }
    .topbar .icon-button { margin-left:auto; }
    .theme-toggle .sun, :root[data-theme=dark] .theme-toggle .moon { display:none; }
    :root[data-theme=dark] .theme-toggle .sun { display:block; }
    @media (prefers-color-scheme:dark) { :root:not([data-theme=light]) .theme-toggle .moon { display:none; } :root:not([data-theme=light]) .theme-toggle .sun { display:block; } }

    /* Pages */
    main { flex:1; width:100%; max-width:1120px; padding:32px 32px 64px; }
    main:focus { outline:none; }
    .page-head { margin-bottom:28px; }
    .eyebrow { margin:0 0 4px; font-size:13px; font-weight:600; color:var(--blue); }
    h1 { font-size:28px; font-weight:750; letter-spacing:-.7px; line-height:1.2; margin:0 0 6px; }
    .lead { margin:0; max-width:640px; color:var(--muted); }
    .status { color:var(--muted); }
    .error { padding:14px 16px; color:var(--bad); background:var(--bad-soft); border-radius:10px; }

    .dept { margin-top:28px; }
    .dept-head { display:flex; align-items:baseline; gap:10px; margin:0 0 12px; }
    .dept-head h2 { margin:0; font-size:15px; font-weight:700; }
    .dept-head a { font-size:13px; color:var(--faint); text-decoration:none; }
    .dept-head a:hover { color:var(--blue); text-decoration:underline; }
    .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:14px; }
    .tile { display:flex; gap:14px; align-items:flex-start; padding:18px; color:inherit; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; transition:border-color .15s,transform .15s; }
    .tile:hover { border-color:var(--blue); transform:translateY(-1px); }
    .tile-icon, .hero-icon { display:grid; place-items:center; flex-shrink:0; border-radius:11px; background:var(--blue-soft); color:var(--blue); }
    .tile-icon { width:42px; height:42px; }
    .tile-body { min-width:0; flex:1; }
    .tile-title { display:flex; align-items:baseline; gap:8px; justify-content:space-between; }
    .tile h3 { margin:0; font-size:15.5px; font-weight:650; line-height:1.35; }
    .code { font-size:11px; font-weight:700; letter-spacing:.6px; color:var(--blue); white-space:nowrap; }
    .tile p { margin:4px 0 0; font-size:14px; color:var(--muted); line-height:1.5; }

    .module { padding:28px; background:var(--surface); border:1px solid var(--line); border-radius:16px; }
    .module-top { display:flex; gap:18px; align-items:flex-start; flex-wrap:wrap; }
    .hero-icon { width:56px; height:56px; border-radius:14px; }
    .hero-icon svg { width:26px; height:26px; }
    .module-top > div { flex:1; min-width:220px; }
    .module h1 { font-size:26px; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; margin-top:22px; }
    .button { display:inline-flex; align-items:center; gap:8px; padding:10px 18px; font:inherit; font-size:14.5px; font-weight:600; text-decoration:none; border-radius:10px; cursor:pointer; }
    .button svg { width:16px; height:16px; stroke-width:2; }
    .button.primary { color:#fff; background:#1f62a8; border:1px solid #1f62a8; }
    .button.primary:hover { background:#174d86; border-color:#174d86; }
    .button.ghost { color:var(--ink); background:transparent; border:1px solid var(--line); }
    .button.ghost:hover { border-color:var(--blue); color:var(--blue); }
    .facts { display:grid; grid-template-columns:repeat(auto-fit,minmax(180px,1fr)); gap:0; margin:26px 0 0; border-top:1px solid var(--line); }
    .facts div { padding:14px 0 0; }
    .facts dt { font-size:12px; font-weight:600; letter-spacing:.4px; text-transform:uppercase; color:var(--faint); }
    .facts dd { margin:2px 0 0; font-size:14.5px; overflow-wrap:anywhere; }
    .related { margin-top:32px; }

    .scrim { display:none; }
    @media(max-width:880px) {
      .shell { grid-template-columns:1fr; }
      .sidebar { position:fixed; inset:0 auto 0 0; z-index:30; width:280px; max-width:85vw; transform:translateX(-100%); transition:transform .2s; box-shadow:none; }
      .shell.open .sidebar { transform:none; box-shadow:0 0 40px #0004; }
      .shell.open .scrim { display:block; position:fixed; inset:0; z-index:20; background:var(--scrim); }
      .menu-button { display:grid; }
      .topbar { padding:0 16px; }
      main { padding:24px 16px 48px; }
      h1 { font-size:24px; } .module h1 { font-size:22px; }
      .module { padding:20px; }
      .search kbd { display:none; }
    }
    @media(prefers-reduced-motion:reduce) { .tile, .sidebar { transition:none; } .tile:hover { transform:none; } }
  </style>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <div class="shell" id="shell">
    <aside class="sidebar" id="sidebar" aria-label="Modules">
      <a class="brand" href="#/"><img class="seal" src="candoni-seal.svg" alt="" width="38" height="38"><div><div class="brand-name">MGO ERP</div><div class="brand-sub">Municipal Government of Candoni</div></div></a>
      <label class="search"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="search" type="search" placeholder="Search modules" aria-label="Search modules" autocomplete="off"><kbd aria-hidden="true">/</kbd></label>
      <nav class="nav" id="nav" aria-label="Modules"></nav>
      <div class="side-foot">Each module opens in a new tab and uses its own sign-in.</div>
    </aside>
    <div class="scrim" id="scrim"></div>
    <div class="content">
      <header class="topbar">
        <button class="icon-button menu-button" id="menu-button" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
        <ol class="crumbs" id="crumbs"></ol>
        <button id="theme-toggle" class="icon-button theme-toggle" type="button" aria-label="Switch to night mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </header>
      <main id="main" tabindex="-1"><p class="status" role="status">Loading modules…</p></main>
    </div>
  </div>
  <noscript><p class="error">JavaScript is required to show the modules. Please enable it and reload this page.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
