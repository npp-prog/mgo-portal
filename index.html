<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0d1724" media="(prefers-color-scheme: dark)">
  <meta name="description" content="MGO Portal — one place to open the municipal systems of the Municipal Government of Candoni.">
  <title>MGO Portal · Municipality of Candoni</title>
  <link rel="icon" href="candoni-seal.svg" type="image/svg+xml">
  <script>try { const t = localStorage.getItem('mgo-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch {}</script>
  <style>
    :root {
      color-scheme:light;
      --bg:#ffffff; --surface:#ffffff; --ink:#122b45; --muted:#5a6e83; --faint:#8696a8;
      --line:#e6ecf2; --blue:#1f62a8; --blue-soft:#edf4fc;
      --bad:#a33b3b; --bad-soft:#fbeaea;
    }
    @media (prefers-color-scheme:dark) {
      :root:not([data-theme=light]) {
        color-scheme:dark;
        --bg:#0d1724; --surface:#111e2e; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
        --line:#1f3247; --blue:#7db8f3; --blue-soft:#17304b;
        --bad:#f19a9a; --bad-soft:#3d1e1e;
      }
    }
    :root[data-theme=dark] {
      color-scheme:dark;
      --bg:#0d1724; --surface:#111e2e; --ink:#e6eef7; --muted:#a0b3c7; --faint:#71889f;
      --line:#1f3247; --blue:#7db8f3; --blue-soft:#17304b;
      --bad:#f19a9a; --bad-soft:#3d1e1e;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.6 "Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; -webkit-font-smoothing:antialiased; }
    [hidden] { display:none !important; }
    .skip { position:fixed; top:12px; left:12px; padding:10px 16px; background:var(--surface); color:var(--ink); border-radius:8px; z-index:10; transform:translateY(-200%); }
    .skip:focus { transform:none; }
    :focus-visible { outline:2px solid var(--blue); outline-offset:3px; }
    svg { width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:1.6; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .page { min-height:100svh; display:flex; flex-direction:column; }
    .wrap { width:100%; max-width:1040px; margin:0 auto; padding-left:32px; padding-right:32px; }

    header .wrap { display:flex; align-items:center; justify-content:space-between; gap:16px; padding-top:28px; padding-bottom:28px; }
    .brand { display:flex; align-items:center; gap:12px; min-width:0; }
    .seal { width:40px; height:40px; flex-shrink:0; }
    .brand-name { font-size:16px; font-weight:700; letter-spacing:-.2px; line-height:1.25; }
    .brand-sub { color:var(--muted); font-size:13px; line-height:1.3; }
    .theme-toggle { display:grid; place-items:center; width:40px; height:40px; padding:0; color:var(--muted); background:transparent; border:1px solid var(--line); border-radius:50%; cursor:pointer; transition:color .15s,border-color .15s; }
    .theme-toggle:hover { color:var(--blue); border-color:var(--blue); }
    .theme-toggle svg { width:18px; height:18px; }
    .theme-toggle .sun, :root[data-theme=dark] .theme-toggle .moon { display:none; }
    :root[data-theme=dark] .theme-toggle .sun { display:block; }
    @media (prefers-color-scheme:dark) { :root:not([data-theme=light]) .theme-toggle .moon { display:none; } :root:not([data-theme=light]) .theme-toggle .sun { display:block; } }

    main { flex:1; padding-top:40px; padding-bottom:72px; }
    h1 { font-size:34px; font-weight:700; letter-spacing:-1px; line-height:1.15; margin:0 0 10px; }
    .intro { margin:0 0 40px; max-width:620px; color:var(--muted); font-size:16px; }
    .status { color:var(--muted); font-size:14px; margin:0 0 16px; }
    .error { padding:14px 16px; color:var(--bad); background:var(--bad-soft); border-radius:10px; }

    .apps { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:16px; }
    .app { display:flex; flex-direction:column; min-width:0; padding:24px; color:inherit; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:16px; transition:border-color .18s,transform .18s; }
    .app:hover { border-color:var(--blue); transform:translateY(-2px); }
    .card-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:20px; }
    .icon { display:grid; place-items:center; width:44px; height:44px; border-radius:12px; background:var(--blue-soft); color:var(--blue); }
    .launch { color:var(--faint); transition:color .18s,transform .18s; }
    .launch svg { width:18px; height:18px; }
    .app:hover .launch { color:var(--blue); transform:translate(2px,-2px); }
    .app h2 { font-size:17px; font-weight:650; letter-spacing:-.2px; line-height:1.35; margin:0 0 6px; }
    .description { color:var(--muted); font-size:14.5px; line-height:1.55; margin:0 0 20px; }
    .meta { display:flex; gap:8px; align-items:baseline; min-width:0; margin-top:auto; font-size:12.5px; color:var(--faint); }
    .code { font-weight:700; letter-spacing:.6px; color:var(--blue); }
    .domain { min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

    .foot { padding:24px 0 32px; border-top:1px solid var(--line); font-size:13px; color:var(--faint); }

    @media(max-width:900px) { .apps { grid-template-columns:repeat(2,minmax(0,1fr)); } }
    @media(max-width:600px) {
      .wrap { padding-left:20px; padding-right:20px; }
      header .wrap { padding-top:20px; padding-bottom:20px; }
      .seal { width:36px; height:36px; }
      main { padding-top:20px; padding-bottom:48px; }
      h1 { font-size:27px; }
      .intro { margin-bottom:28px; }
      .apps { grid-template-columns:1fr; gap:12px; }
      .app { padding:20px; }
    }
    @media(prefers-reduced-motion:reduce) { .app, .launch { transition:none; } .app:hover, .app:hover .launch { transform:none; } }
  </style>
</head>
<body>
  <a class="skip" href="#apps">Skip to systems</a>
  <div class="page">
    <header>
      <div class="wrap">
        <div class="brand"><img class="seal" src="candoni-seal.svg" alt="Municipality of Candoni seal" width="40" height="40"><div><div class="brand-name">MGO Portal</div><div class="brand-sub">Municipal Government of Candoni</div></div></div>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Switch to night mode"><svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg><svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      </div>
    </header>
    <main id="main">
      <div class="wrap">
        <h1>Municipal systems</h1>
        <p class="intro" id="new-tab">Choose a system to open it in a new tab. Each system uses its own sign-in.</p>
        <p id="status" class="status" role="status">Loading systems…</p>
        <div class="apps" id="apps" tabindex="-1"></div>
      </div>
    </main>
    <footer><div class="wrap"><div class="foot">© Municipal Government of Candoni</div></div></footer>
  </div>
  <noscript><p class="error wrap">JavaScript is required to show the systems. Please enable it and reload this page.</p></noscript>
  <script type="module" src="app.js"></script>
</body>
</html>
